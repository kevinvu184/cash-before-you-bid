<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1b13" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Before Bid" />
    <!--
      Ground colours before first paint. The stylesheet paints the page from
      var(--color-bg) / var(--color-text), which nothing defines until React
      mounts and useColorMode writes the active skin's tokens — so the script
      below resolves the skin and mode from the same URL params the app reads
      and sets those two variables synchronously, in <head>, before the body
      paints. The :root block under it is the no-JS ground (the plain skin's
      light tokens).

      Trade-off: eight colour values live here as well as in the skins'
      tokens.ts. src/skins/preloadedGround.test.ts parses this file and fails
      if any of them drifts from the token objects, so the duplication cannot
      rot silently. The alternative — generating a stylesheet from the tokens
      at build time — would remove the duplication but put a Vite plugin
      between the token objects and the page for the sake of four pairs.
    -->
    <style>
      :root {
        --color-bg: #ffffff;
        --color-text: #000000;
      }
      html,
      body {
        background: var(--color-bg);
        color: var(--color-text);
      }
    </style>
    <!--
      The document language, resolved before the body paints. <html lang> below
      is the no-JS ground and matches DEFAULT_LANG, so under ?lang=en the page
      declared Vietnamese until the effect in App.tsx ran — long enough for a
      screen reader to pick a voice and start reading the masthead in the wrong
      language. Resolved here from the same param the app reads, alongside the
      skin and mode, so all three are settled in one pass.

      src/skins/preloadedGround.test.ts holds LANGS and DEFAULT_LANG here to
      src/logic/lang.ts, the same way it holds the colour table to the tokens.
    -->
    <script>
      ;(function () {
        var LANGS = ['en', 'vi']
        var DEFAULT_LANG = 'vi'
        var GROUND = {
          default: {
            light: ['#f7f3e8', '#201c15'],
            dark: ['#1f1b13', '#ece4d1'],
          },
          plain: {
            light: ['#ffffff', '#000000'],
            dark: ['#000000', '#ffffff'],
          },
        }
        var has = function (id) {
          return Object.prototype.hasOwnProperty.call(GROUND, id)
        }
        try {
          var params = new URLSearchParams(window.location.search)
          var rawSkin = params.get('skin')
          var skin = rawSkin === null ? 'default' : has(rawSkin) ? rawSkin : 'plain'
          var rawMode = params.get('mode')
          var mode =
            rawMode === 'light' || rawMode === 'dark'
              ? rawMode
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var rawLang = params.get('lang')
          // Without a ?lang= it is the document that decides, not the default:
          // the build writes one document per locale and stamps each with its
          // own data-doc-lang, so on /en/ the answer is English even though
          // DEFAULT_LANG is Vietnamese. Falling back to DEFAULT_LANG here
          // would overwrite the lang the served HTML already got right, which
          // is the whole thing both this script and the prerender exist to
          // fix. No attribute — the dev server, or a build with no prerender —
          // and DEFAULT_LANG is still the answer.
          var docLang = document.documentElement.getAttribute('data-doc-lang')
          var fallbackLang = LANGS.indexOf(docLang) === -1 ? DEFAULT_LANG : docLang
          var lang = LANGS.indexOf(rawLang) === -1 ? fallbackLang : rawLang
          var ground = GROUND[skin][mode]
          var root = document.documentElement
          root.lang = lang
          root.dataset.skin = skin
          root.dataset.mode = mode
          root.style.setProperty('color-scheme', mode)
          root.style.setProperty('--color-bg', ground[0])
          root.style.setProperty('--color-text', ground[1])
        } catch (error) {
          // Leaves the :root fallback above in place; the app still boots.
        }
      })()
    </script>
    <!--
      The web fonts are served from this origin (src/fonts.css declares the
      faces, public/fonts holds the files). Nothing here reaches a third party,
      so there is no preconnect to make and no DNS lookup, TLS handshake and
      stylesheet round trip standing between the browser and the first paint.

      These two preloads are the body face for the default locale: latin covers
      the digits and Latin letters every figure on the page is made of, and
      vietnamese covers the diacritics the default copy is written in. They
      start downloading in parallel with the module bundle rather than waiting
      for the stylesheet to be parsed. The remaining faces — latin-ext, and the
      monospace family used for the figures below the fold — are left to the
      stylesheet; preloading everything would just make these two arrive later.
    -->
    <link
      rel="preload"
      href="/fonts/libre-franklin-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/libre-franklin-vietnamese.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Everything below is per-locale, and it is generated: src/prerender/head.ts
      is the one statement of it, and scripts/prerender.mjs replaces this whole
      block in each document it writes. What is checked in here is that same
      generator's output for the default locale, so `npm run dev` and a build
      that somehow skipped the prerender both serve something coherent rather
      than nothing. src/prerender/head.test.ts regenerates it and fails if the
      two have drifted.

      Do not hand-edit between the markers. Change head.ts; the build prints
      the regenerated block when this copy has fallen behind it.
    -->
    <!-- prerender:head:start -->
    <title>Công cụ tính thuế trước bạ và tiền đặt cọc tại Victoria — Cash Before You Bid</title>
    <meta name="description" content="Nắm rõ các con số trước phiên đấu giá: thuế trước bạ, tiền đặt cọc, các loại phí và tổng số tiền mặt cần chuẩn bị khi mua nhà." />
    <link rel="canonical" href="https://kevinvu184.github.io/cash-before-you-bid/" />
    <link rel="alternate" hreflang="en" href="https://kevinvu184.github.io/cash-before-you-bid/en/" />
    <link rel="alternate" hreflang="vi" href="https://kevinvu184.github.io/cash-before-you-bid/" />
    <link rel="alternate" hreflang="x-default" href="https://kevinvu184.github.io/cash-before-you-bid/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cash Before You Bid" />
    <meta property="og:url" content="https://kevinvu184.github.io/cash-before-you-bid/" />
    <meta property="og:title" content="Công cụ tính thuế trước bạ và tiền đặt cọc tại Victoria — Cash Before You Bid" />
    <meta property="og:description" content="Nắm rõ các con số trước phiên đấu giá: thuế trước bạ, tiền đặt cọc, các loại phí và tổng số tiền mặt cần chuẩn bị khi mua nhà." />
    <meta property="og:image" content="https://kevinvu184.github.io/cash-before-you-bid/icons/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_AU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Công cụ tính thuế trước bạ và tiền đặt cọc tại Victoria — Cash Before You Bid" />
    <meta name="twitter:description" content="Nắm rõ các con số trước phiên đấu giá: thuế trước bạ, tiền đặt cọc, các loại phí và tổng số tiền mặt cần chuẩn bị khi mua nhà." />
    <meta name="twitter:image" content="https://kevinvu184.github.io/cash-before-you-bid/icons/icon-512.png" />
    <!-- prerender:head:end -->
  </head>
  <body>
    <div id="root"></div>
    <!--
      The prerendered shell inside #root is one locale, on the default skin, in
      the default state (src/prerender/Shell.tsx). It is right for the URL that
      asked for this document and wrong for any other, so this decides which it
      is and drops it when it is wrong — here, immediately after the shell is
      parsed and before the browser paints, rather than in <head> where #root
      does not exist yet.

      Dropping it costs nothing that was not already the case: an empty #root
      is exactly what this page shipped before the prerender existed.

      data-doc-lang is written by scripts/prerender.mjs. It is absent in
      development and there is no shell there either, so this returns at once.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        var docLang = root.getAttribute('data-doc-lang')
        if (docLang === null) return
        try {
          var params = new URLSearchParams(window.location.search)
          var lang = params.get('lang')
          if (lang !== 'en' && lang !== 'vi') {
            // No ?lang= at all: the directory this document was served from is
            // the request. The app reads the query string and nothing else, so
            // a non-default locale has to be said there before the module
            // bundle reads it.
            if (docLang !== 'vi') {
              params.set('lang', docLang)
              window.history.replaceState(
                window.history.state,
                '',
                window.location.pathname + '?' + params.toString() + window.location.hash,
              )
            }
            lang = docLang
          }
          // The shell is one language, one skin, one colour mode and the
          // default figures. A URL that asks for any of them differently gets
          // the blank start it always got rather than a flash of the wrong
          // page. ?mode= is in that list even though the ground colours above
          // already honour it: the shell also paints the mode switch, and a
          // build cannot know which of its three buttons to mark pressed. On
          // ?mode=dark it says 'system', which a screen reader would read out
          // as the answer until hydration corrects it. No ?mode= at all — the
          // common case, following the operating system — is what the shell
          // was rendered for and keeps its paint.
          var stale = lang !== docLang || (params.get('skin') || 'default') !== 'default'
          params.forEach(function (_value, key) {
            if (key !== 'lang' && key !== 'skin') stale = true
          })
          if (stale) document.getElementById('root').replaceChildren()
        } catch (error) {
          // The shell stays put; React replaces it on mount either way.
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
